<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clearance Sale - Swipe & Claim</title>
    <!-- Faster CDN Imports -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .swipe-left {
            transform: translateX(-120%) rotate(-15deg) !important;
            opacity: 0 !important;
            transition: all 0.3s ease-out;
        }
        .swipe-right {
            transform: translateX(120%) rotate(15deg) !important;
            opacity: 0 !important;
            transition: all 0.3s ease-out;
        }
        .swipe-down {
            transform: translateY(120%) !important;
            opacity: 0 !important;
            transition: all 0.3s ease-out;
        }
    </style>
</head>
<body class="bg-gray-900 min-h-screen flex flex-col items-center justify-between p-4 font-sans text-gray-100 overflow-hidden select-none">

    <!-- User Identity Modal -->
    <div id="user-modal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-gray-800 border border-gray-700 w-full max-w-xs rounded-3xl p-6 text-center space-y-4 shadow-2xl">
            <div class="text-4xl">👋</div>
            <h3 class="text-lg font-bold text-white">Welcome to Clearance Sale</h3>
            <p class="text-xs text-gray-400">Please enter your name or WhatsApp number so we can verify your claim.</p>
            <input type="text" id="username-input" placeholder="Your Name / WhatsApp No." 
                   class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-xl text-white text-sm focus:outline-none focus:border-red-500">
            <button onclick="saveUsername()" class="w-full py-3 bg-red-600 hover:bg-red-500 rounded-xl font-bold text-white transition">Start Browsing</button>
        </div>
    </div>

    <!-- Image Zoom / Fullscreen Modal -->
    <div id="image-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex flex-col items-center justify-center p-2 cursor-zoom-out" onclick="closeImageModal()">
        <button onclick="closeImageModal()" class="absolute top-4 right-4 bg-gray-800/80 text-white rounded-full w-10 h-10 flex items-center justify-center text-xl font-bold border border-gray-600 z-10">✕</button>
        <div class="relative w-full h-full flex items-center justify-center p-2">
            <img id="modal-img" src="" alt="Zoomed View" class="max-w-full max-h-full object-contain rounded-xl shadow-2xl">
        </div>
        <span class="text-xs text-gray-400 mb-2">Tap anywhere to close</span>
    </div>

    <!-- Header -->
    <header class="w-full max-w-sm flex justify-between items-center py-2">
        <div class="flex items-center gap-2">
            <span class="text-xl font-black tracking-wider text-red-500">🔥 CLEARANCE</span>
            <span id="user-display" class="text-[10px] bg-gray-800 text-gray-400 px-2 py-0.5 rounded border border-gray-700 cursor-pointer" onclick="changeUsername()">👤 Guest</span>
        </div>
        
        <!-- 可点击跳转的页码按钮 -->
        <button id="card-counter" onclick="jumpToPage()" title="Click to jump to page" class="text-xs bg-gray-800 hover:bg-gray-700 active:scale-95 text-gray-300 px-2.5 py-1 rounded-full border border-gray-700 transition cursor-pointer flex items-center gap-1">
            Loading...
        </button>
    </header>

    <!-- Main Card Deck -->
    <main class="relative w-full max-w-sm h-[520px] flex items-center justify-center">
        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center space-y-4 p-6 bg-gray-800 rounded-3xl border border-gray-700 w-full">
            <div class="text-5xl">🎉</div>
            <h2 class="text-xl font-bold">All Items Viewed!</h2>
            <p class="text-sm text-gray-400">You're all caught up with the latest deals! Check back later for new arrivals.</p>
            <div class="flex gap-2">
                <button onclick="prevCard()" class="flex-1 py-3 bg-gray-700 hover:bg-gray-600 rounded-xl font-bold transition">↩️ Back</button>
                <button onclick="resetProgress()" class="flex-1 py-3 bg-red-600 hover:bg-red-500 rounded-xl font-bold transition">Restart from Newest</button>
            </div>
        </div>

        <!-- Dynamic Card Insertion -->
        <div id="card-stack" class="relative w-full h-full"></div>
    </main>

    <!-- Action Buttons -->
    <footer id="action-buttons" class="w-full max-w-sm grid grid-cols-4 gap-2 pt-2 pb-4">
        <button id="btn-back" onclick="prevCard()" 
            class="flex flex-col items-center justify-center p-2.5 rounded-2xl bg-gray-800 border border-gray-700 hover:bg-gray-700 active:scale-95 transition disabled:opacity-30 disabled:cursor-not-allowed">
            <span class="text-xl mb-0.5">↩️</span>
            <span class="text-[10px] font-bold text-gray-400">BACK</span>
        </button>

        <button onclick="handleAction('PASS')" 
            class="flex flex-col items-center justify-center p-2.5 rounded-2xl bg-gray-800 border border-gray-700 hover:bg-gray-700 active:scale-95 transition">
            <span class="text-xl mb-0.5">👎</span>
            <span class="text-[10px] font-bold text-gray-400">PASS</span>
        </button>

        <button id="btn-share" onclick="handleAction('SHARING')" 
            class="flex flex-col items-center justify-center p-2.5 rounded-2xl bg-indigo-600/20 border border-indigo-500/50 hover:bg-indigo-600/30 active:scale-95 transition disabled:opacity-30 disabled:cursor-not-allowed">
            <span class="text-xl mb-0.5">🤝</span>
            <span id="text-share" class="text-[10px] font-bold text-indigo-400">SHARE</span>
        </button>

        <button id="btn-claim" onclick="handleAction('CLAIM_ALL')" 
            class="flex flex-col items-center justify-center p-2.5 rounded-2xl bg-red-600/20 border border-red-500/50 hover:bg-red-600/30 active:scale-95 transition disabled:opacity-30 disabled:cursor-not-allowed">
            <span class="text-xl mb-0.5">👑</span>
            <span id="text-claim" class="text-[10px] font-bold text-red-400">CLAIM ALL</span>
        </button>
    </footer>

    <script>
        const SUPABASE_URL = 'https://vyzxhhetywwljkehelvo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_tIGjO_Xe0Mv-9ormYe3VjQ_WGc1rlpR'; // 👈 记得替换你的 Publishable Key

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let products = [];
        let currentIndex = 0; // 默认每次打开都从第 1 页（索引 0）开始
        let currentUser = localStorage.getItem('clearance_user') || '';
        let timerInterval = null;

        function checkUser() {
            if (!currentUser) {
                document.getElementById('user-modal').classList.remove('hidden');
            } else {
                document.getElementById('user-modal').classList.add('hidden');
                document.getElementById('user-display').innerText = `👤 ${currentUser}`;
            }
        }

        function saveUsername() {
            const input = document.getElementById('username-input').value.trim();
            if (!input) {
                alert('Please enter your name or WhatsApp number!');
                return;
            }
            currentUser = input;
            localStorage.setItem('clearance_user', currentUser);
            checkUser();
        }

        function changeUsername() {
            localStorage.removeItem('clearance_user');
            currentUser = '';
            checkUser();
        }

        function openImageModal(imgSrc) {
            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-img');
            modalImg.src = imgSrc;
            modal.classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('image-modal').classList.add('hidden');
        }

        /* ----- 页码点击跳转逻辑 ----- */
        function jumpToPage() {
            if (!products || products.length === 0) return;

            const totalPages = products.length;
            const input = prompt(`Enter page number (1 - ${totalPages}):`, (currentIndex + 1).toString());

            if (input === null) return;

            const pageNum = parseInt(input.trim(), 10);

            if (isNaN(pageNum) || pageNum < 1 || pageNum > totalPages) {
                alert(`Please enter a valid page number between 1 and ${totalPages}!`);
                return;
            }

            currentIndex = pageNum - 1;
            renderCurrentCard();
        }

        function resetProgress() {
            currentIndex = 0;
            renderCurrentCard();
        }

        function preloadImages(index) {
            for (let i = index + 1; i <= index + 3 && i < products.length; i++) {
                if (products[i] && products[i].image_url) {
                    const img = new Image();
                    img.src = products[i].image_url.trim();
                }
            }
        }

        async function loadProducts() {
            try {
                const { data, error } = await supabaseClient
                    .from('products')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) {
                    alert('Error loading data!\nCode: ' + error.code + '\nMessage: ' + error.message);
                    return;
                }

                products = data || [];
                currentIndex = 0;

                if (products.length === 0) {
                    showEmptyState();
                } else {
                    renderCurrentCard();
                }
            } catch (err) {
                alert('Network exception: ' + err.message);
            }
        }

        function renderCurrentCard() {
            if (timerInterval) clearInterval(timerInterval);

            const cardStack = document.getElementById('card-stack');
            const actionButtons = document.getElementById('action-buttons');
            const emptyState = document.getElementById('empty-state');
            
            cardStack.innerHTML = '';

            if (currentIndex >= products.length) {
                showEmptyState();
                return;
            }

            cardStack.classList.remove('hidden');
            actionButtons.classList.remove('hidden');
            emptyState.classList.add('hidden');

            preloadImages(currentIndex);

            const current = products[currentIndex];
            document.getElementById('card-counter').innerText = `${currentIndex + 1} / ${products.length} 🔍`;

            const btnBack = document.getElementById('btn-back');
            if (btnBack) {
                btnBack.disabled = (currentIndex <= 0);
            }

            const imgUrl = (current.image_url && typeof current.image_url === 'string' && current.image_url.trim() !== '') 
                ? current.image_url.trim() 
                : 'https://via.placeholder.com/400x400?text=No+Image';

            const card = document.createElement('div');
            card.id = `card-${current.id}`;
            card.className = "absolute inset-0 bg-gray-800 rounded-3xl overflow-hidden card-shadow border border-gray-700 flex flex-col justify-between transition-all duration-300";
            
            const imgContainer = document.createElement('div');
            imgContainer.className = "relative w-full h-80 bg-black/50 overflow-hidden flex items-center justify-center cursor-zoom-in group";
            imgContainer.onclick = () => openImageModal(imgUrl);

            const imgEl = document.createElement('img');
            imgEl.src = imgUrl;
            imgEl.alt = current.title || 'Product Image';
            imgEl.className = "w-full h-full object-contain transition-transform duration-300 group-hover:scale-105";
            imgEl.decoding = "async";

            const zoomHint = document.createElement('div');
            zoomHint.className = "absolute top-3 left-3 bg-black/60 backdrop-blur-md p-1.5 rounded-full text-xs text-gray-300 border border-white/10 flex items-center justify-center pointer-events-none";
            zoomHint.innerHTML = "🔍";

            const stockBadge = document.createElement('div');
            stockBadge.className = "absolute top-3 right-3 bg-black/60 backdrop-blur-md px-3 py-1 rounded-full text-xs font-bold text-red-400 border border-white/10 pointer-events-none";
            stockBadge.innerText = `${current.stock || 0} left`;

            const priceTag = document.createElement('div');
            priceTag.className = "absolute bottom-3 left-3 bg-red-600/90 backdrop-blur-md px-3 py-1.5 rounded-xl flex items-baseline gap-2 shadow-lg border border-red-500/50 pointer-events-none";
            
            const currentPrice = current.price ? (current.price.toString().startsWith('$') ? current.price : `$${current.price}`) : '';
            const originalPrice = current.original_price ? (current.original_price.toString().startsWith('$') ? current.original_price : `$${current.original_price}`) : '';

            if (currentPrice && originalPrice) {
                priceTag.innerHTML = `
                    <span class="text-xl font-black text-white">${currentPrice}</span>
                    <span class="text-xs text-red-200 line-through opacity-75">${originalPrice}</span>
                `;
            } else if (currentPrice) {
                priceTag.innerHTML = `<span class="text-xl font-black text-white">${currentPrice}</span>`;
            } else if (originalPrice) {
                priceTag.innerHTML = `<span class="text-xl font-black text-white">${originalPrice}</span>`;
            } else {
                priceTag.innerHTML = `<span class="text-sm font-bold text-white">Special Deal</span>`;
            }

            imgContainer.appendChild(imgEl);
            imgContainer.appendChild(zoomHint);
            imgContainer.appendChild(stockBadge);
            imgContainer.appendChild(priceTag);

            const contentContainer = document.createElement('div');
            contentContainer.className = "p-5 flex-1 flex flex-col justify-between";
            contentContainer.innerHTML = `
                <div>
                    <h2 class="text-xl font-black text-white line-clamp-1">${current.title || 'Clearance Item'}</h2>
                    <p class="text-xs text-gray-400 mt-1">ID: #${current.id}</p>
                </div>
                <div id="card-status-badge" class="mt-2 text-center py-2 px-3 rounded-xl text-xs font-bold transition"></div>
            `;

            card.appendChild(imgContainer);
            card.appendChild(contentContainer);

            cardStack.appendChild(card);
            
            try {
                updateButtonsState(current);
            } catch (err) {
                console.error('Error updating buttons:', err);
            }
        }

        function updateButtonsState(product) {
            if (timerInterval) clearInterval(timerInterval);

            const btnClaim = document.getElementById('btn-claim');
            const btnShare = document.getElementById('btn-share');
            const textClaim = document.getElementById('text-claim');
            const textShare = document.getElementById('text-share');
            const badge = document.getElementById('card-status-badge');

            if (!badge || !product) return;

            const claimersList = (product.claimed_by && typeof product.claimed_by === 'string') 
                ? product.claimed_by.split(',').map(s => s.trim()).filter(Boolean) 
                : [];
            
            const claimerCount = claimersList.length;
            const claimerInfo = product.claimed_by ? ` by ${product.claimed_by}` : '';
            const status = product.status || 'AVAILABLE';
            const userAlreadyJoined = claimersList.includes(currentUser);

            let isExpired = false;
            let timeRemainingText = '';

            if (product.share_expires_at) {
                const expiresTime = new Date(product.share_expires_at).getTime();
                const nowTime = new Date().getTime();
                const diff = expiresTime - nowTime;

                if (diff <= 0) {
                    isExpired = true;
                } else {
                    const hours = Math.floor(diff / (1000 * 60 * 60));
                    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                    timeRemainingText = `${hours}h ${minutes}m ${seconds}s`;

                    timerInterval = setInterval(() => {
                        updateButtonsState(product);
                    }, 1000);
                }
            }

            if (status === 'CLAIMED_ALL' || status === 'CLAIM_ALL') {
                btnClaim.disabled = true;
                btnShare.disabled = true;
                textClaim.innerText = "CLAIMED";
                textShare.innerText = "LOCKED";
                badge.className = "text-center py-2 px-3 rounded-xl text-xs font-bold bg-red-500/10 text-red-400 border border-red-500/20";
                badge.innerText = userAlreadyJoined ? `👑 You claimed this item!` : `👑 Claimed All${claimerInfo}! Sold out.`;
            } 
            else if (isExpired && claimerCount >= 2) {
                btnClaim.disabled = true;
                btnShare.disabled = true;
                textClaim.innerText = "LOCKED";
                textShare.innerText = "CLOSED";
                badge.className = "text-center py-2 px-3 rounded-xl text-xs font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20";
                badge.innerText = `⏳ 12h Time Up! Group Deal Closed with ${claimerCount} users (${product.claimed_by}).`;
            }
            else if (status === 'SHARING') {
                btnClaim.disabled = true;
                textClaim.innerText = "LOCKED";

                let timeNotice = timeRemainingText ? ` (Ends in: ${timeRemainingText})` : ` (Waiting for 2nd user...)`;
                
                if (userAlreadyJoined) {
                    btnShare.disabled = true;
                    textShare.innerText = "JOINED";
                    badge.className = "text-center py-2 px-3 rounded-xl text-xs font-bold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20";
                    badge.innerText = `🤝 Joined Share (${claimerCount}/3)${timeNotice}`;
                } else {
                    btnShare.disabled = false;
                    textShare.innerText = "JOIN SHARE";
                    badge.className = "text-center py-2 px-3 rounded-xl text-xs font-bold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20";
                    badge.innerText = `🤝 Active Share (${claimerCount}/3)${timeNotice}! Join now.`;
                }
            } 
            else if (status === 'SHARE_FULL') {
                btnClaim.disabled = true;
                btnShare.disabled = true;
                textClaim.innerText = "LOCKED";
                textShare.innerText = "FULL";
                badge.className = "text-center py-2 px-3 rounded-xl text-xs font-bold bg-purple-500/10 text-purple-400 border border-purple-500/20";
                badge.innerText = `🔒 Group Share FULL (3/3)${claimerInfo}! Locked for order.`;
            } 
            else {
                btnClaim.disabled = false;
                btnShare.disabled = false;
                textClaim.innerText = "CLAIM ALL";
                textShare.innerText = "SHARE";
                badge.className = "text-center py-2 px-3 rounded-xl text-xs font-bold bg-blue-500/10 text-blue-400 border border-blue-500/20";
                badge.innerText = "⚡ Available! Claim or Share now.";
            }
        }

        async function handleAction(actionType) {
            if (!currentUser) {
                checkUser();
                return;
            }

            if (currentIndex >= products.length) return;
            const current = products[currentIndex];
            const currentCard = document.getElementById(`card-${current.id}`);

            if (actionType === 'PASS') {
                if (currentCard) currentCard.classList.add('swipe-down');
                setTimeout(() => nextCard(), 250);
                return;
            }

            const { data: latest, error: fetchErr } = await supabaseClient
                .from('products')
                .select('status, claimed_by, share_expires_at')
                .eq('id', current.id)
                .single();

            if (fetchErr) {
                alert('Network error: ' + fetchErr.message);
                return;
            }

            const currentStatus = latest.status || 'AVAILABLE';
            const existingClaimers = (latest.claimed_by && typeof latest.claimed_by === 'string') 
                ? latest.claimed_by.split(',').map(s => s.trim()).filter(Boolean) 
                : [];

            current.status = currentStatus;
            current.claimed_by = latest.claimed_by;
            current.share_expires_at = latest.share_expires_at;

            if (currentStatus === 'CLAIMED_ALL' || currentStatus === 'CLAIM_ALL') {
                alert('Too late! This item was completely claimed.');
                updateButtonsState(current);
                return;
            }

            if ((currentStatus === 'SHARING' || currentStatus === 'SHARE_FULL') && actionType === 'CLAIM_ALL') {
                alert('Cannot Claim All! A Group Share is already active.');
                updateButtonsState(current);
                return;
            }

            if (latest.share_expires_at && new Date(latest.share_expires_at).getTime() <= new Date().getTime() && existingClaimers.length >= 2) {
                alert('This 12-hour group share has expired and closed.');
                updateButtonsState(current);
                return;
            }

            let updatedClaimers = [...existingClaimers];
            if (!updatedClaimers.includes(currentUser)) {
                updatedClaimers.push(currentUser);
            }

            const MAX_SHARE_PLAYERS = 3;
            let newStatus = actionType;
            let newExpiresAt = latest.share_expires_at;

            if (actionType === 'SHARING') {
                if (updatedClaimers.length === 2 && !newExpiresAt) {
                    const now = new Date();
                    now.setHours(now.getHours() + 12);
                    newExpiresAt = now.toISOString();
                }

                if (updatedClaimers.length >= MAX_SHARE_PLAYERS) {
                    newStatus = 'SHARE_FULL';
                }
            }

            const newClaimedByString = updatedClaimers.join(', ');

            const { error: updateErr } = await supabaseClient
                .from('products')
                .update({ 
                    status: newStatus,
                    claimed_by: newClaimedByString,
                    share_expires_at: newExpiresAt
                })
                .eq('id', current.id);

            if (updateErr) {
                alert('Update failed: ' + updateErr.message);
                return;
            }

            current.status = newStatus;
            current.claimed_by = newClaimedByString;
            current.share_expires_at = newExpiresAt;

            if (actionType === 'CLAIM_ALL') {
                if (currentCard) currentCard.classList.add('swipe-right');
            } else if (actionType === 'SHARING') {
                if (currentCard) currentCard.classList.add('swipe-left');
            }

            setTimeout(() => nextCard(), 250);
        }

        function nextCard() {
            currentIndex++;
            renderCurrentCard();
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCurrentCard();
            }
        }

        function showEmptyState() {
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('card-stack').classList.add('hidden');
            document.getElementById('empty-state').classList.remove('hidden');
            document.getElementById('card-counter').innerText = `${products.length} / ${products.length} 🔍`;
            
            const btnBack = document.getElementById('btn-back');
            if (btnBack) {
                btnBack.disabled = false;
            }
        }

        supabaseClient
            .channel('public:products')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'products' }, payload => {
                const updatedProduct = products.find(p => p.id === payload.new.id);
                if (updatedProduct) {
                    updatedProduct.status = payload.new.status;
                    updatedProduct.stock = payload.new.stock;
                    updatedProduct.claimed_by = payload.new.claimed_by;
                    updatedProduct.share_expires_at = payload.new.share_expires_at;

                    if (products[currentIndex] && products[currentIndex].id === payload.new.id) {
                        updateButtonsState(updatedProduct);
                    }
                }
            })
            .subscribe();

        checkUser();
        loadProducts();
    </script>
</body>
</html>
