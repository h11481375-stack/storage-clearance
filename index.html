<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clearance Sale - Swipe & Claim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f17;
        }
        .card-glow {
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 20px 0 rgba(255, 255, 255, 0.03);
        }
        .glass-panel {
            background: rgba(18, 24, 38, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .swipe-left {
            transform: translateX(-120%) rotate(-15deg) !important;
            opacity: 0 !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .swipe-right {
            transform: translateX(120%) rotate(15deg) !important;
            opacity: 0 !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .swipe-down {
            transform: translateY(120%) !important;
            opacity: 0 !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* 自定义网格滚动条 */
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-[#0b0f17] min-h-screen flex flex-col items-center justify-between p-4 text-gray-100 overflow-hidden select-none">

    <!-- User Identity Modal -->
    <div id="user-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-xs rounded-3xl p-6 text-center space-y-4 shadow-2xl">
            <div class="w-16 h-16 bg-red-500/10 border border-red-500/20 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-2">🔥</div>
            <h3 class="text-xl font-extrabold text-white">Clearance Perks</h3>
            <p class="text-xs text-gray-400 leading-relaxed">Enter your Name or WhatsApp No. to unlock exclusive claims and group deals.</p>
            <input type="text" id="username-input" placeholder="Name or WhatsApp No." 
                   class="w-full px-4 py-3.5 bg-gray-900/80 border border-white/10 rounded-2xl text-white text-sm focus:outline-none focus:border-red-500 transition">
            <button onclick="saveUsername()" class="w-full py-3.5 bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 rounded-2xl font-bold text-white shadow-lg shadow-red-900/30 transition active:scale-95">Start Browsing</button>
        </div>
    </div>

    <!-- Image Zoom Modal -->
    <div id="image-modal" class="fixed inset-0 bg-black/95 backdrop-blur-xl z-50 hidden flex flex-col items-center justify-center p-2 cursor-zoom-out" onclick="closeImageModal()">
        <button onclick="closeImageModal()" class="absolute top-6 right-6 glass-panel text-white rounded-full w-10 h-10 flex items-center justify-center text-lg font-bold z-10">✕</button>
        <div class="relative w-full h-full flex items-center justify-center p-2">
            <img id="modal-img" src="" alt="Zoomed View" class="max-w-full max-h-full object-contain rounded-2xl shadow-2xl">
        </div>
    </div>

    <!-- Lucky Wheel Modal (福利抽奖弹窗) -->
    <div id="lucky-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass-panel max-w-xs w-full p-6 rounded-3xl border border-pink-500/30 text-center relative shadow-2xl">
            <button onclick="closeLuckyWheelModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-lg">✕</button>
            
            <div class="text-4xl mb-2">🎁</div>
            <h2 class="text-lg font-black text-white">DAILY LUCKY DRAW</h2>
            <p class="text-xs text-gray-400 mt-1 mb-6">Win a <span class="text-pink-400 font-bold">Labubu Blind Box</span> or <span class="text-amber-400 font-bold">$5 Vouchers</span>!</p>

            <div id="spinner-box" class="w-40 h-40 mx-auto mb-6 bg-gradient-to-tr from-pink-500 via-purple-600 to-amber-500 rounded-full flex items-center justify-center border-4 border-white/20 shadow-inner relative overflow-hidden animate-pulse">
                <span class="text-white font-black text-xs drop-shadow-md">🎰 Labubu / Voucher</span>
            </div>

            <button onclick="startSpin()" id="btn-spin" class="w-full py-3 bg-gradient-to-r from-pink-500 to-rose-500 rounded-2xl text-white font-black text-xs shadow-lg shadow-pink-500/30 active:scale-95 transition">
                SPIN NOW 🚀
            </button>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center">
        <div class="glass-panel w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 flex flex-col max-h-[80vh] shadow-2xl border-t border-white/10">
            <div class="flex justify-between items-center pb-4 border-b border-white/10">
                <div class="flex items-center gap-2">
                    <span class="text-lg">🛒</span>
                    <h3 class="text-base font-bold text-white">My Claimed Deals</h3>
                </div>
                <button onclick="closeCartModal()" class="text-gray-400 hover:text-white font-bold text-lg px-2">✕</button>
            </div>
            <div id="cart-items-list" class="flex-1 overflow-y-auto py-4 space-y-3 custom-scroll"></div>
            <div class="pt-3 border-t border-white/10">
                <button onclick="closeCartModal()" class="w-full py-3 bg-white/5 hover:bg-white/10 rounded-2xl text-xs font-bold text-gray-300 transition">Close</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="w-full max-w-sm flex justify-between items-center py-2 z-10">
        <div class="flex items-center gap-2">
            <span class="bg-gradient-to-r from-red-500 to-orange-500 bg-clip-text text-transparent font-black text-lg tracking-tight">CLEARANCE</span>
            <span id="user-display" class="text-[10px] font-semibold bg-white/5 text-gray-400 px-2.5 py-1 rounded-full border border-white/10 cursor-pointer hover:bg-white/10 transition" onclick="changeUsername()">👤 Guest</span>
        </div>
        
        <div class="flex items-center gap-1.5">
            <!-- Mode Toggle Button (卡片/网格切换) -->
            <button id="btn-mode-toggle" onclick="toggleViewMode()" class="text-xs glass-panel hover:bg-white/10 active:scale-95 text-indigo-300 px-2.5 py-1.5 rounded-full transition cursor-pointer flex items-center gap-1 font-bold">
                ▦ Grid
            </button>

            <!-- Cart Button -->
            <button onclick="openCartModal()" class="text-xs glass-panel hover:bg-white/10 active:scale-95 text-red-400 px-2.5 py-1.5 rounded-full transition cursor-pointer flex items-center gap-1 font-bold">
                🛒 <span id="cart-count" class="bg-red-500/20 text-red-400 px-1.5 py-0.5 rounded-full text-[10px]">0</span>
            </button>

            <!-- Counter -->
            <button id="card-counter" onclick="jumpToPage()" title="Click to jump" class="text-xs glass-panel hover:bg-white/10 active:scale-95 text-gray-300 px-2.5 py-1.5 rounded-full transition cursor-pointer flex items-center gap-1 font-semibold">
                Loading...
            </button>
        </div>
    </header>

    <!-- NEW vs DISCOVER Tabs -->
    <div class="w-full max-w-sm flex items-center justify-center gap-2 my-1 z-10">
        <button id="tab-new" onclick="switchTab('NEW')" 
                class="flex-1 py-1.5 rounded-xl text-[11px] font-black transition border border-red-500 bg-red-500 text-white shadow-lg shadow-red-500/20">
            🔥 NEW
        </button>
        <button id="tab-discover" onclick="switchTab('DISCOVER')" 
                class="flex-1 py-1.5 rounded-xl text-[11px] font-black transition border border-white/10 bg-white/5 text-gray-400 hover:bg-white/10">
            🎲 DISCOVER
        </button>
    </div>

    <!-- Main Container -->
<main class="relative w-full max-w-sm h-[520px] flex items-center justify-center my-auto overflow-hidden">
    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center space-y-5 p-8 glass-panel rounded-3xl w-full border border-white/10">
        <div class="w-20 h-20 bg-emerald-500/10 border border-emerald-500/20 rounded-full flex items-center justify-center text-4xl mx-auto">🎉</div>
        <div>
            <h2 class="text-xl font-bold text-white">All Caught Up!</h2>
            <p class="text-xs text-gray-400 mt-1">You've seen all clearance products for now.</p>
        </div>
        <div class="flex gap-3 pt-2">
            <button onclick="prevCard()" class="flex-1 py-3 bg-white/5 hover:bg-white/10 border border-white/10 rounded-2xl font-bold text-xs transition">↩️ Back</button>
            <button onclick="resetProgress()" class="flex-1 py-3 bg-red-600 hover:bg-red-500 rounded-2xl font-bold text-xs shadow-lg shadow-red-900/30 transition">Restart</button>
        </div>
    </div>

    <!-- 1. Tinder Card Mode View -->
    <div id="card-stack" class="relative w-full h-full"></div>

    <!-- 2. Grid Mode View (修复了高度和 flex 适应) -->
    <div id="grid-view" class="hidden w-full h-full overflow-y-auto custom-scroll grid grid-cols-2 gap-3 p-1 align-content-start"></div>
</main>

    <!-- Action Buttons Footer (Cards Mode Only) -->
    <footer id="action-buttons" class="w-full max-w-sm flex items-center justify-around py-3 px-2 z-10">
        <button id="btn-back" onclick="prevCard()" class="w-12 h-12 rounded-full glass-panel flex items-center justify-center text-lg text-gray-300 hover:scale-110 active:scale-95 transition disabled:opacity-20 disabled:cursor-not-allowed">↩️</button>
        <button onclick="handleAction('PASS')" class="w-14 h-14 rounded-full glass-panel border-gray-600/50 flex items-center justify-center text-xl text-gray-300 hover:scale-110 active:scale-95 transition hover:border-gray-400">👎</button>
        <button id="btn-share" onclick="handleAction('SHARING')" class="w-16 h-16 rounded-full bg-gradient-to-tr from-indigo-600 to-violet-500 text-white flex flex-col items-center justify-center shadow-lg shadow-indigo-900/40 hover:scale-110 active:scale-95 transition border border-indigo-400/30 disabled:opacity-30 disabled:cursor-not-allowed">
            <span class="text-xl">🤝</span>
            <span id="text-share" class="text-[9px] font-black tracking-tighter mt-0.5">SHARE</span>
        </button>
        <button id="btn-claim" onclick="handleAction('CLAIM_ALL')" class="w-16 h-16 rounded-full bg-gradient-to-tr from-red-600 to-orange-500 text-white flex flex-col items-center justify-center shadow-lg shadow-red-900/40 hover:scale-110 active:scale-95 transition border border-red-400/30 disabled:opacity-30 disabled:cursor-not-allowed">
            <span class="text-xl">👑</span>
            <span id="text-claim" class="text-[9px] font-black tracking-tighter mt-0.5">CLAIM ALL</span>
        </button>
    </footer>

    <script>
        const SUPABASE_URL = 'https://vyzxhhetywwljkehelvo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_tIGjO_Xe0Mv-9ormYe3VjQ_WGc1rlpR'; // 👈 替换你的 Key

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let products = [];         // 数据库原始数据
        let displayProducts = [];  // 根据 Tab 排序后的展示列表
        let currentIndex = 0;
        let currentUser = localStorage.getItem('clearance_user') || '';
        let timerInterval = null;
        let viewMode = 'CARD';      // 'CARD' 或 'GRID'
        let currentTab = 'NEW';     // 'NEW' 或 'DISCOVER'

        // 网格模式增量加载控制
        let currentGridLoadedCount = 0;
        const GRID_BATCH_SIZE = 20;

        function checkUser() {
            if (!currentUser) {
                document.getElementById('user-modal').classList.remove('hidden');
            } else {
                document.getElementById('user-modal').classList.add('hidden');
                document.getElementById('user-display').innerText = `👤 ${currentUser}`;
                updateCartCount();
            }
        }

        function saveUsername() {
            const input = document.getElementById('username-input').value.trim();
            if (!input) {
                alert('Please enter your name or WhatsApp number!');
                return;
            }
            currentUser = input;
            localStorage.setItem('clearance_user', currentUser);
            checkUser();
        }

        function changeUsername() {
            localStorage.removeItem('clearance_user');
            currentUser = '';
            checkUser();
        }

        function openImageModal(imgSrc) {
            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-img');
            modalImg.src = imgSrc;
            modal.classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('image-modal').classList.add('hidden');
        }

        /* 抽奖 Modal 函数 */
        function openLuckyWheelModal() {
            document.getElementById('lucky-modal').classList.remove('hidden');
        }

        function closeLuckyWheelModal() {
            document.getElementById('lucky-modal').classList.add('hidden');
        }

        function startSpin() {
    const btn = document.getElementById('btn-spin');
    const spinner = document.getElementById('spinner-box');
    
    btn.innerText = "SPINNING...";
    btn.disabled = true;

    // 1. 生成 0 到 100 之间的随机数
    const rand = Math.random() * 100;

    // 2. 模拟转盘转动效果
    let count = 0;
    const spinEffect = setInterval(() => {
        count++;
        spinner.style.transform = `rotate(${count * 45}deg)`;
    }, 50);

    // 3. 1.5 秒后停止转动并判定结果
    setTimeout(() => {
        clearInterval(spinEffect);
        spinner.style.transform = 'rotate(0deg)';
        
        btn.innerText = "SPIN NOW 🚀";
        btn.disabled = false;

        // 4. 根据概率区间判定中奖类型
        if (rand < 2) {
            // 2% 概率：三块优惠券
            alert("🎉 CONGRATS! You won a $3 Off Voucher!\n\nTake a screenshot and contact support on WhatsApp to claim!");
            closeLuckyWheelModal();
        } else if (rand < 5) {
            // 3% 概率 (2 + 3 = 5)：Labubu 盲盒
            alert("🔥 UNBELIEVABLE! You won a Labubu Blind Box!\n\nTake a screenshot and contact support on WhatsApp immediately!");
            closeLuckyWheelModal();
        } else {
            // 95% 概率 (剩下 95%)：未中奖
            alert("😅 So Close! You didn't win this time.\n\nTry again tomorrow or browse more clearance deals!");
        }
    }, 1500);
}

        function openCartModal() {
            if (!currentUser) { checkUser(); return; }
            renderCartItems();
            document.getElementById('cart-modal').classList.remove('hidden');
        }

        function closeCartModal() {
            document.getElementById('cart-modal').classList.add('hidden');
        }

        /* NEW 与 DISCOVER 标签页切换 */
        function switchTab(tab) {
            currentTab = tab;
            const btnNew = document.getElementById('tab-new');
            const btnDiscover = document.getElementById('tab-discover');

            if (tab === 'NEW') {
                btnNew.className = "flex-1 py-1.5 rounded-xl text-[11px] font-black transition border border-red-500 bg-red-500 text-white shadow-lg shadow-red-500/20";
                btnDiscover.className = "flex-1 py-1.5 rounded-xl text-[11px] font-black transition border border-white/10 bg-white/5 text-gray-400 hover:bg-white/10";
            } else {
                btnDiscover.className = "flex-1 py-1.5 rounded-xl text-[11px] font-black transition border border-purple-500 bg-purple-500 text-white shadow-lg shadow-purple-500/20";
                btnNew.className = "flex-1 py-1.5 rounded-xl text-[11px] font-black transition border border-white/10 bg-white/5 text-gray-400 hover:bg-white/10";
            }

            applySortAndRender();
        }

        function applySortAndRender() {
            let list = [...products];
            if (currentTab === 'NEW') {
                // NEW 模式：纯最新 ID 倒序
                displayProducts = list.sort((a, b) => b.id - a.id);
            } else {
                // DISCOVER 模式：未 Claim 的滞销品打散在前
                let unclaimed = list.filter(p => !p.claimed_by || p.claimed_by.trim() === '');
                let claimed = list.filter(p => p.claimed_by && p.claimed_by.trim() !== '');
                unclaimed.sort(() => Math.random() - 0.5);
                displayProducts = [...unclaimed, ...claimed];
            }

            currentIndex = 0;
            if (viewMode === 'CARD') renderCurrentCard();
            else renderGridView();
        }

        /* 切换视图模式 (卡片 🎴 vs 双列网格 ▦) */
        function toggleViewMode() {
            viewMode = (viewMode === 'CARD') ? 'GRID' : 'CARD';
            const btn = document.getElementById('btn-mode-toggle');
            const footer = document.getElementById('action-buttons');
            const cardStack = document.getElementById('card-stack');
            const gridView = document.getElementById('grid-view');

            if (viewMode === 'GRID') {
                btn.innerText = '🎴 Cards';
                footer.classList.add('hidden');
                cardStack.classList.add('hidden');
                gridView.classList.remove('hidden');
                renderGridView();
            } else {
                btn.innerText = '▦ Grid';
                footer.classList.remove('hidden');
                gridView.classList.add('hidden');
                cardStack.classList.remove('hidden');
                renderCurrentCard();
            }
        }

        /* 双列无限滚动网格渲染逻辑 */
function renderGridView() {
    const gridView = document.getElementById('grid-view');
    gridView.innerHTML = '';
    currentGridLoadedCount = 0;

    // 强制显式定义 grid 和的高度，防止高度坍塌
    gridView.className = "w-full h-full overflow-y-auto custom-scroll grid grid-cols-2 gap-3 p-1 content-start";
    gridView.onscroll = handleGridScroll;

    loadMoreGridItems();
}

        function loadMoreGridItems() {
            const gridView = document.getElementById('grid-view');
            if (currentGridLoadedCount >= displayProducts.length) return;

            const nextBatch = displayProducts.slice(currentGridLoadedCount, currentGridLoadedCount + GRID_BATCH_SIZE);

            nextBatch.forEach((p, index) => {
                const totalIndex = currentGridLoadedCount + index;

                // 每隔 10 个网格商品插入一个抽奖 Banner
                if (totalIndex > 0 && totalIndex % 10 === 0) {
                    const luckyCard = document.createElement('div');
                    luckyCard.className = "col-span-2 my-1 p-3.5 rounded-2xl bg-gradient-to-r from-purple-900/80 via-pink-900/80 to-red-900/80 border border-pink-500/40 flex items-center justify-between shadow-lg relative overflow-hidden cursor-pointer";
                    luckyCard.onclick = () => openLuckyWheelModal();
                    
                    luckyCard.innerHTML = `
                        <div class="relative z-10">
                            <div class="flex items-center gap-1.5 mb-0.5">
                                <span class="bg-yellow-400 text-black text-[9px] font-black px-1.5 py-0.2 rounded-full uppercase">🎁 DAILY BONUS</span>
                                <span class="text-[10px] text-pink-200 font-bold">Win Labubu / Vouchers!</span>
                            </div>
                            <div class="text-xs font-black text-white">LUCKY DRAW SPINNER</div>
                        </div>
                        <button class="relative z-10 px-3 py-1.5 bg-yellow-400 text-black font-black text-[11px] rounded-xl shadow-md flex-shrink-0">
                            SPIN 🎡
                        </button>
                    `;
                    gridView.appendChild(luckyCard);
                }

                const globalIdx = displayProducts.findIndex(item => item.id === p.id);
                const imgUrl = p.image_url || 'https://via.placeholder.com/200';
                const price = p.price ? (p.price.toString().startsWith('$') ? p.price : `$${p.price}`) : 'Deal';

                const item = document.createElement('div');
                item.className = "bg-gray-900/90 border border-white/10 rounded-2xl overflow-hidden flex flex-col justify-between p-2 relative glass-panel h-48";

                let statusBadge = `<span class="text-[9px] text-emerald-400 font-bold">AVAILABLE</span>`;
                if (p.status === 'CLAIMED_ALL' || p.status === 'CLAIM_ALL') statusBadge = `<span class="text-[9px] text-red-400 font-bold">👑 CLAIMED</span>`;
                else if (p.status === 'SHARING') statusBadge = `<span class="text-[9px] text-indigo-400 font-bold">🤝 SHARING</span>`;
                else if (p.status === 'SHARE_FULL') statusBadge = `<span class="text-[9px] text-purple-400 font-bold">🔒 FULL</span>`;

                item.innerHTML = `
                    <div class="relative w-full h-24 rounded-xl overflow-hidden bg-black/40 cursor-pointer" onclick="openImageModal('${imgUrl}')">
                        <img src="${imgUrl}" class="w-full h-full object-cover" loading="lazy">
                        <div class="absolute top-1 right-1 bg-black/60 px-1.5 py-0.5 rounded-full text-[9px] font-bold text-red-400">${p.stock || 0} Left</div>
                    </div>
                    <div class="mt-1 flex flex-col justify-between flex-1">
                        <div>
                            <div class="flex justify-between items-center">
                                <span class="text-xs font-black text-white">${price}</span>
                                ${statusBadge}
                            </div>
                            <h3 class="text-[10px] font-semibold text-gray-200 line-clamp-1 mt-0.5">${p.title || 'Product'}</h3>
                        </div>
                        <button onclick="jumpToProduct(${globalIdx})" class="mt-1 w-full py-1 bg-white/5 hover:bg-white/15 border border-white/10 rounded-xl text-[9px] font-bold text-gray-300 transition">
                            View Card 🎴
                        </button>
                    </div>
                `;
                gridView.appendChild(item);
            });

            currentGridLoadedCount += nextBatch.length;
            document.getElementById('card-counter').innerText = `${currentGridLoadedCount}/${displayProducts.length}`;
        }

        /* 触底自动追加 */
        function handleGridScroll() {
            const gridView = document.getElementById('grid-view');
            if (gridView.scrollTop + gridView.clientHeight >= gridView.scrollHeight - 100) {
                loadMoreGridItems();
            }
        }

        function jumpToProduct(idx) {
            currentIndex = idx;
            toggleViewMode();
        }

        function updateCartCount() {
            if (!currentUser || !products) return;
            const myClaimed = products.filter(p => {
                if (!p.claimed_by) return false;
                const claimers = p.claimed_by.split(',').map(s => s.trim());
                return claimers.includes(currentUser);
            });
            document.getElementById('cart-count').innerText = myClaimed.length.toString();
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items-list');
            container.innerHTML = '';

            const myClaimed = products.filter(p => {
                if (!p.claimed_by) return false;
                const claimers = p.claimed_by.split(',').map(s => s.trim());
                return claimers.includes(currentUser);
            });

            if (myClaimed.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-xs text-gray-500">You haven't claimed any items yet.</div>`;
                return;
            }

            myClaimed.forEach(item => {
                const itemEl = document.createElement('div');
                itemEl.className = "flex items-center gap-3 p-3 bg-white/5 border border-white/10 rounded-2xl";
                const imgUrl = item.image_url || 'https://via.placeholder.com/100';
                const typeBadge = (item.status === 'CLAIMED_ALL' || item.status === 'CLAIM_ALL') ? '👑 Claim All' : '🤝 Share';

                itemEl.innerHTML = `
                    <img src="${imgUrl}" class="w-12 h-12 object-cover rounded-xl bg-black/40">
                    <div class="flex-1 min-w-0">
                        <div class="text-xs font-bold text-white truncate">${item.title || 'Product'}</div>
                        <div class="text-[10px] text-gray-400 mt-0.5">${item.price || ''} • <span class="text-indigo-400 font-semibold">${typeBadge}</span></div>
                    </div>
                    <button onclick="cancelClaim(${item.id})" class="px-3 py-1.5 bg-red-500/10 hover:bg-red-500/20 border border-red-500/30 rounded-xl text-[10px] font-bold text-red-400 transition">
                        Cancel
                    </button>
                `;
                container.appendChild(itemEl);
            });
        }

        async function cancelClaim(productId) {
            if (!confirm("Cancel your claim for this item?")) return;

            const product = products.find(p => p.id === productId);
            if (!product) return;

            const existingClaimers = (product.claimed_by && typeof product.claimed_by === 'string')
                ? product.claimed_by.split(',').map(s => s.trim()).filter(Boolean)
                : [];

            const updatedClaimers = existingClaimers.filter(u => u !== currentUser);
            const newClaimedByString = updatedClaimers.join(', ');

            let newStatus = 'AVAILABLE';
            let newExpiresAt = product.share_expires_at;

            if (product.status === 'SHARING' || product.status === 'SHARE_FULL') {
                if (updatedClaimers.length >= 1) newStatus = 'SHARING';
                else { newStatus = 'AVAILABLE'; newExpiresAt = null; }
            } else {
                newStatus = 'AVAILABLE';
                newExpiresAt = null;
            }

            const { error } = await supabaseClient
                .from('products')
                .update({ status: newStatus, claimed_by: newClaimedByString, share_expires_at: newExpiresAt })
                .eq('id', productId);

            if (error) { alert('Failed to cancel: ' + error.message); return; }

            product.status = newStatus;
            product.claimed_by = newClaimedByString;
            product.share_expires_at = newExpiresAt;

            renderCartItems();
            updateCartCount();
            if (viewMode === 'CARD') renderCurrentCard();
            else renderGridView();
        }

        function jumpToPage() {
            if (!displayProducts || displayProducts.length === 0) return;
            const totalPages = displayProducts.length;
            const input = prompt(`Enter product index (1 - ${totalPages}):`, (currentIndex + 1).toString());
            if (input === null) return;
            const pageNum = parseInt(input.trim(), 10);
            if (isNaN(pageNum) || pageNum < 1 || pageNum > totalPages) {
                alert(`Valid range: 1 - ${totalPages}`);
                return;
            }
            currentIndex = pageNum - 1;
            renderCurrentCard();
        }

        function resetProgress() {
            currentIndex = 0;
            renderCurrentCard();
        }

        async function loadProducts() {
            try {
                let allProducts = [];
                let page = 0;
                const pageSize = 1000;
                let hasMore = true;

                while (hasMore) {
                    const { data, error } = await supabaseClient
                        .from('products')
                        .select('*')
                        .order('id', { ascending: false })
                        .range(page * pageSize, (page + 1) * pageSize - 1);

                    if (error) { alert('Error: ' + error.message); return; }

                    if (data && data.length > 0) {
                        allProducts = allProducts.concat(data);
                        if (data.length < pageSize) hasMore = false;
                        else page++;
                    } else { hasMore = false; }
                }

                products = allProducts;
                updateCartCount();
                applySortAndRender(); // 载入数据后根据当前 Tab 排序渲染

                if (displayProducts.length === 0) showEmptyState();
            } catch (err) { alert('Network exception: ' + err.message); }
        }

        function renderCurrentCard() {
            if (timerInterval) clearInterval(timerInterval);

            const cardStack = document.getElementById('card-stack');
            const actionButtons = document.getElementById('action-buttons');
            const emptyState = document.getElementById('empty-state');
            
            cardStack.innerHTML = '';

            if (currentIndex >= displayProducts.length) { showEmptyState(); return; }

            cardStack.classList.remove('hidden');
            actionButtons.classList.remove('hidden');
            emptyState.classList.add('hidden');

            const current = displayProducts[currentIndex];
            document.getElementById('card-counter').innerText = `${currentIndex + 1}/${displayProducts.length}`;

            const btnBack = document.getElementById('btn-back');
            if (btnBack) btnBack.disabled = (currentIndex <= 0);

            const imgUrl = (current.image_url && typeof current.image_url === 'string' && current.image_url.trim() !== '') 
                ? current.image_url.trim() : 'https://via.placeholder.com/400x400?text=No+Image';

            const card = document.createElement('div');
            card.id = `card-${current.id}`;
            card.className = "absolute inset-0 rounded-3xl overflow-hidden card-glow border border-white/10 flex flex-col justify-between transition-all duration-300 bg-gray-900";

            const currentPrice = current.price ? (current.price.toString().startsWith('$') ? current.price : `$${current.price}`) : '';
            const originalPrice = current.original_price ? (current.original_price.toString().startsWith('$') ? current.original_price : `$${current.original_price}`) : '';

            card.innerHTML = `
                <div class="relative w-full h-full cursor-zoom-in group" onclick="openImageModal('${imgUrl}')">
                    <img src="${imgUrl}" alt="${current.title || 'Product'}" class="w-full h-full object-cover">
                    <div class="absolute top-4 left-4 right-4 flex justify-between items-center pointer-events-none">
                        <div class="glass-panel px-3 py-1 rounded-full text-[10px] font-bold text-gray-200">🔍 Tap to Zoom</div>
                        <div class="glass-panel px-3 py-1 rounded-full text-xs font-extrabold text-red-400 border border-red-500/20">${current.stock || 0} Left</div>
                    </div>
                    <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-gray-950 via-gray-950/80 to-transparent p-5 pt-12 flex flex-col justify-end">
                        <div class="flex items-baseline gap-2 mb-1">
                            <span class="text-3xl font-black text-white tracking-tight">${currentPrice || 'Special Deal'}</span>
                            ${originalPrice ? `<span class="text-xs text-gray-400 line-through">${originalPrice}</span>` : ''}
                        </div>
                        <h2 class="text-lg font-bold text-white line-clamp-1">${current.title || 'Clearance Item'}</h2>
                        <p class="text-[10px] text-gray-400 mt-0.5">ID: #${current.id}</p>
                        <div id="card-status-badge" class="mt-3 text-center py-2 px-3 rounded-xl text-xs font-bold transition backdrop-blur-md"></div>
                    </div>
                </div>
            `;

            cardStack.appendChild(card);
            updateButtonsState(current);
        }

        function updateButtonsState(product) {
            if (timerInterval) clearInterval(timerInterval);

            const btnClaim = document.getElementById('btn-claim');
            const btnShare = document.getElementById('btn-share');
            const textClaim = document.getElementById('text-claim');
            const textShare = document.getElementById('text-share');
            const badge = document.getElementById('card-status-badge');

            if (!badge || !product) return;

            const claimersList = (product.claimed_by && typeof product.claimed_by === 'string') 
                ? product.claimed_by.split(',').map(s => s.trim()).filter(Boolean) : [];
            
            const claimerCount = claimersList.length;
            const claimerInfo = product.claimed_by ? ` by ${product.claimed_by}` : '';
            const status = product.status || 'AVAILABLE';
            const userAlreadyJoined = claimersList.includes(currentUser);

            let isExpired = false;
            let timeRemainingText = '';

            if (product.share_expires_at) {
                const expiresTime = new Date(product.share_expires_at).getTime();
                const nowTime = new Date().getTime();
                const diff = expiresTime - nowTime;

                if (diff <= 0) isExpired = true;
                else {
                    const hours = Math.floor(diff / (1000 * 60 * 60));
                    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                    timeRemainingText = `${hours}h ${minutes}m ${seconds}s`;

                    timerInterval = setInterval(() => updateButtonsState(product), 1000);
                }
            }

            if (status === 'CLAIMED_ALL' || status === 'CLAIM_ALL') {
                btnClaim.disabled = true; btnShare.disabled = true;
                textClaim.innerText = "CLAIMED"; textShare.innerText = "LOCKED";
                badge.className = "text-center py-2 px-3 rounded-xl text-xs font-bold bg-red-500/20 text-red-300 border border-red-500/30";
                badge.innerText = userAlreadyJoined ? `👑 You claimed this item!` : `👑 Claimed All${claimerInfo}! Sold out.`;
            } 
            else if (isExpired && claimerCount >= 2) {
                btnClaim.disabled = true; btnShare.disabled = true;
                textClaim.innerText = "LOCKED"; textShare.innerText = "CLOSED";
                badge.className = "text-center py-2 px-3 rounded-xl text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30";
                badge.innerText = `⏳ 12h Time Up! Closed with ${claimerCount} users (${product.claimed_by}).`;
            }
            else if (status === 'SHARING') {
                btnClaim.disabled = true; textClaim.innerText = "LOCKED";
                let timeNotice = timeRemainingText ? ` (Ends: ${timeRemainingText})` : ` (Waiting for 2nd...)`;
                
                if (userAlreadyJoined) {
                    btnShare.disabled = true; textShare.innerText = "JOINED";
                    badge.className = "text-center py-2 px-3 rounded-xl text-xs font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30";
                    badge.innerText = `🤝 Joined Share (${claimerCount}/3)${timeNotice}`;
                } else {
                    btnShare.disabled = false; textShare.innerText = "JOIN";
                    badge.className = "text-center py-2 px-3 rounded-xl text-xs font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30";
                    badge.innerText = `🤝 Active Share (${claimerCount}/3)${timeNotice}! Join now.`;
                }
            } 
            else if (status === 'SHARE_FULL') {
                btnClaim.disabled = true; btnShare.disabled = true;
                textClaim.innerText = "LOCKED"; textShare.innerText = "FULL";
                badge.className = "text-center py-2 px-3 rounded-xl text-xs font-bold bg-purple-500/20 text-purple-300 border border-purple-500/30";
                badge.innerText = `🔒 Group Share FULL (3/3)${claimerInfo}!`;
            } 
            else {
                btnClaim.disabled = false; btnShare.disabled = false;
                textClaim.innerText = "CLAIM ALL"; textShare.innerText = "SHARE";
                badge.className = "text-center py-2 px-3 rounded-xl text-xs font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
                badge.innerText = "⚡ Available! Claim or Share now.";
            }
        }

        async function handleAction(actionType) {
            if (!currentUser) { checkUser(); return; }
            if (currentIndex >= displayProducts.length) return;
            const current = displayProducts[currentIndex];
            const currentCard = document.getElementById(`card-${current.id}`);

            if (actionType === 'PASS') {
                if (currentCard) currentCard.classList.add('swipe-down');
                setTimeout(() => nextCard(), 250);
                return;
            }

            const { data: latest, error: fetchErr } = await supabaseClient
                .from('products').select('status, claimed_by, share_expires_at').eq('id', current.id).single();

            if (fetchErr) { alert('Network error: ' + fetchErr.message); return; }

            const currentStatus = latest.status || 'AVAILABLE';
            const existingClaimers = (latest.claimed_by && typeof latest.claimed_by === 'string') 
                ? latest.claimed_by.split(',').map(s => s.trim()).filter(Boolean) : [];

            current.status = currentStatus;
            current.claimed_by = latest.claimed_by;
            current.share_expires_at = latest.share_expires_at;

            if (currentStatus === 'CLAIMED_ALL' || currentStatus === 'CLAIM_ALL') {
                alert('Too late! This item was completely claimed.');
                updateButtonsState(current); return;
            }

            if ((currentStatus === 'SHARING' || currentStatus === 'SHARE_FULL') && actionType === 'CLAIM_ALL') {
                alert('Cannot Claim All! A Group Share is already active.');
                updateButtonsState(current); return;
            }

            if (latest.share_expires_at && new Date(latest.share_expires_at).getTime() <= new Date().getTime() && existingClaimers.length >= 2) {
                alert('This 12-hour group share has expired.');
                updateButtonsState(current); return;
            }

            let updatedClaimers = [...existingClaimers];
            if (!updatedClaimers.includes(currentUser)) updatedClaimers.push(currentUser);

            const MAX_SHARE_PLAYERS = 3;
            let newStatus = actionType;
            let newExpiresAt = latest.share_expires_at;

            if (actionType === 'SHARING') {
                if (updatedClaimers.length === 2 && !newExpiresAt) {
                    const now = new Date();
                    now.setHours(now.getHours() + 12);
                    newExpiresAt = now.toISOString();
                }
                if (updatedClaimers.length >= MAX_SHARE_PLAYERS) newStatus = 'SHARE_FULL';
            }

            const newClaimedByString = updatedClaimers.join(', ');

            const { error: updateErr } = await supabaseClient
                .from('products')
                .update({ status: newStatus, claimed_by: newClaimedByString, share_expires_at: newExpiresAt })
                .eq('id', current.id);

            if (updateErr) { alert('Update failed: ' + updateErr.message); return; }

            current.status = newStatus;
            current.claimed_by = newClaimedByString;
            current.share_expires_at = newExpiresAt;

            updateCartCount();

            if (actionType === 'CLAIM_ALL') { if (currentCard) currentCard.classList.add('swipe-right'); }
            else if (actionType === 'SHARING') { if (currentCard) currentCard.classList.add('swipe-left'); }

            setTimeout(() => nextCard(), 250);
        }

        function nextCard() {
            currentIndex++;
            renderCurrentCard();
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCurrentCard();
            }
        }

        function showEmptyState() {
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('card-stack').classList.add('hidden');
            document.getElementById('empty-state').classList.remove('hidden');
            document.getElementById('card-counter').innerText = `${displayProducts.length}/${displayProducts.length}`;
            const btnBack = document.getElementById('btn-back');
            if (btnBack) btnBack.disabled = false;
        }

        supabaseClient
            .channel('public:products')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'products' }, payload => {
                const updatedProduct = products.find(p => p.id === payload.new.id);
                if (updatedProduct) {
                    updatedProduct.status = payload.new.status;
                    updatedProduct.stock = payload.new.stock;
                    updatedProduct.claimed_by = payload.new.claimed_by;
                    updatedProduct.share_expires_at = payload.new.share_expires_at;

                    updateCartCount();

                    if (viewMode === 'CARD' && displayProducts[currentIndex] && displayProducts[currentIndex].id === payload.new.id) {
                        updateButtonsState(updatedProduct);
                    } else if (viewMode === 'GRID') {
                        renderGridView();
                    }
                }
            })
            .subscribe();

        checkUser();
        loadProducts();
    </script>
</body>
</html>
