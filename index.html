<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clearance Shopping</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f17;
            touch-action: manipulation;
        }
        .glass-panel {
            background: rgba(18, 24, 38, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-[#0b0f17] text-gray-100 flex flex-col h-screen overflow-hidden">

    <!-- Top Header -->
    <header class="glass-panel px-4 py-3 flex items-center justify-between z-20 flex-shrink-0">
        <div class="flex items-center gap-2">
            <span class="text-xl">🛍️</span>
            <h1 class="text-base font-black bg-gradient-to-r from-red-500 to-orange-500 bg-clip-text text-transparent">
                CLEARANCE HUB
            </h1>
        </div>
        
        <!-- View Switcher & Cart -->
        <div class="flex items-center gap-2">
            <button id="view-toggle-btn" onclick="toggleView()" class="px-3 py-1.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl text-xs font-bold transition flex items-center gap-1">
                <span id="view-icon">📱</span>
                <span id="view-text">Grid</span>
            </button>
            <button onclick="openCartModal()" class="px-3 py-1.5 bg-red-500/20 border border-red-500/30 text-red-400 rounded-xl text-xs font-bold transition flex items-center gap-1 relative">
                🛒 Cart
                <span id="cart-count-badge" class="bg-red-500 text-white text-[9px] px-1.5 py-0.2 rounded-full font-black hidden">0</span>
            </button>
        </div>
    </header>

    <!-- NEW vs DISCOVER Tabs -->
    <div class="flex items-center justify-center gap-2 px-4 py-2 bg-black/40 border-b border-white/5 flex-shrink-0 z-10">
        <button id="tab-new" onclick="switchTab('NEW')" 
                class="flex-1 max-w-[160px] py-1.5 rounded-xl text-xs font-black transition border border-red-500 bg-red-500 text-white shadow-lg shadow-red-500/20">
            🔥 NEW ARRIVALS
        </button>
        <button id="tab-discover" onclick="switchTab('DISCOVER')" 
                class="flex-1 max-w-[160px] py-1.5 rounded-xl text-xs font-black transition border border-white/10 bg-white/5 text-gray-400 hover:bg-white/10">
            🎲 DISCOVER
        </button>
    </div>

    <!-- Main Container -->
    <main class="flex-1 relative overflow-hidden">
        <!-- Single Card View Mode -->
        <div id="card-view" class="w-full h-full flex flex-col items-center justify-center p-4">
            <div id="single-card-container" class="w-full max-w-sm h-full max-h-[620px] flex flex-col justify-between">
                <!-- Single card content injected by JS -->
            </div>
        </div>

        <!-- Grid View Mode -->
        <div id="grid-view" class="hidden w-full h-full overflow-y-auto custom-scroll grid grid-cols-2 gap-3 p-3 content-start">
            <!-- Grid items & Lucky Banners injected by JS -->
        </div>
    </main>

    <!-- Image Lightbox Modal (大图全屏查看) -->
    <div id="image-modal" class="fixed inset-0 bg-black/95 backdrop-blur-xl z-50 hidden flex flex-col items-center justify-center p-3 cursor-zoom-out" onclick="closeImageModal()">
        <button onclick="closeImageModal()" class="absolute top-6 right-6 glass-panel text-white rounded-full w-10 h-10 flex items-center justify-center text-lg font-bold z-10">✕</button>
        <div class="relative w-full h-full flex items-center justify-center">
            <img id="modal-img" src="" class="max-w-full max-h-[90vh] object-contain rounded-2xl shadow-2xl">
        </div>
    </div>

    <!-- Lucky Wheel Modal -->
    <div id="lucky-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass-panel max-w-sm w-full p-6 rounded-3xl border border-pink-500/30 text-center relative shadow-2xl">
            <button onclick="closeLuckyWheelModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-lg">✕</button>
            
            <div class="text-4xl mb-2">🎁</div>
            <h2 class="text-xl font-black text-white">DAILY LUCKY DRAW</h2>
            <p class="text-xs text-gray-400 mt-1 mb-6">Win a <span class="text-pink-400 font-bold">Labubu Blind Box</span> or <span class="text-amber-400 font-bold">$5 Vouchers</span>!</p>

            <div id="spinner-box" class="w-44 h-44 mx-auto mb-6 bg-gradient-to-tr from-pink-500 via-purple-600 to-amber-500 rounded-full flex items-center justify-center border-4 border-white/20 shadow-inner relative overflow-hidden animate-pulse">
                <span class="text-white font-black text-sm drop-shadow-md">🎰 Labubu / Voucher</span>
            </div>

            <button onclick="startSpin()" id="btn-spin" class="w-full py-3.5 bg-gradient-to-r from-pink-500 to-rose-500 rounded-2xl text-white font-black text-sm shadow-lg shadow-pink-500/30 active:scale-95 transition">
                SPIN NOW 🚀
            </button>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass-panel max-w-md w-full p-5 rounded-3xl border border-white/10 flex flex-col max-h-[80vh]">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-white/10">
                <h2 class="text-base font-black text-white flex items-center gap-2">🛒 My Claimed Bills</h2>
                <button onclick="closeCartModal()" class="text-gray-400 hover:text-white">✕</button>
            </div>
            <div id="cart-items-list" class="flex-1 overflow-y-auto custom-scroll space-y-3 pr-1">
                <!-- Cart items injected by JS -->
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vyzxhhetywwljkehelvo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_tIGjO_Xe0Mv-9ormYe3VjQ_WGc1rlpR'; // 👈 记得替换为你的 Key

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let products = [];
        let displayProducts = [];
        let currentView = 'card'; // 'card' or 'grid'
        let currentTab = 'NEW';   // 'NEW' or 'DISCOVER'
        let currentCardIndex = 0;
        let currentUser = 'Aiden';

        // 1. 初始化调取数据
        async function fetchProducts() {
            const { data, error } = await supabaseClient
                .from('products')
                .select('*')
                .order('id', { ascending: false });

            if (error) { console.error(error); return; }
            
            products = data || [];
            applySortAndRender();
        }

        // 2. 核心排序与分类切换
        function switchTab(tab) {
            currentTab = tab;
            const btnNew = document.getElementById('tab-new');
            const btnDiscover = document.getElementById('tab-discover');

            if (tab === 'NEW') {
                btnNew.className = "flex-1 max-w-[160px] py-1.5 rounded-xl text-xs font-black transition border border-red-500 bg-red-500 text-white shadow-lg shadow-red-500/20";
                btnDiscover.className = "flex-1 max-w-[160px] py-1.5 rounded-xl text-xs font-black transition border border-white/10 bg-white/5 text-gray-400 hover:bg-white/10";
            } else {
                btnDiscover.className = "flex-1 max-w-[160px] py-1.5 rounded-xl text-xs font-black transition border border-purple-500 bg-purple-500 text-white shadow-lg shadow-purple-500/20";
                btnNew.className = "flex-1 max-w-[160px] py-1.5 rounded-xl text-xs font-black transition border border-white/10 bg-white/5 text-gray-400 hover:bg-white/10";
            }

            applySortAndRender();
        }

        function applySortAndRender() {
            let list = [...products];
            if (currentTab === 'NEW') {
                displayProducts = list.sort((a, b) => b.id - a.id);
            } else {
                let unclaimed = list.filter(p => !p.claimed_by || p.claimed_by.trim() === '');
                let claimed = list.filter(p => p.claimed_by && p.claimed_by.trim() !== '');
                unclaimed.sort(() => Math.random() - 0.5);
                displayProducts = [...unclaimed, ...claimed];
            }

            currentCardIndex = 0;
            if (currentView === 'card') renderCardView();
            else renderGridView();
        }

        // 3. 视图切换逻辑
        function toggleView() {
            const cardView = document.getElementById('card-view');
            const gridView = document.getElementById('grid-view');
            const viewIcon = document.getElementById('view-icon');
            const viewText = document.getElementById('view-text');

            if (currentView === 'card') {
                currentView = 'grid';
                cardView.classList.add('hidden');
                renderGridView();
                viewIcon.innerText = '💳';
                viewText.innerText = 'Card';
            } else {
                currentView = 'card';
                gridView.className = "hidden w-full h-full overflow-y-auto custom-scroll grid grid-cols-2 gap-3 p-3 content-start";
                cardView.classList.remove('hidden');
                renderCardView();
                viewIcon.innerText = '📱';
                viewText.innerText = 'Grid';
            }
        }

        // 4. 图片放大 Modal 控制
        function openImageModal(imgUrl) {
            if (!imgUrl) return;
            document.getElementById('modal-img').src = imgUrl;
            document.getElementById('image-modal').classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('image-modal').classList.add('hidden');
        }

        // 5. 卡片视图渲染（已绑定图片点击放大）
        function renderCardView() {
            const container = document.getElementById('single-card-container');
            if (!displayProducts.length) {
                container.innerHTML = `<div class="text-center py-20 text-xs text-gray-500">No products available.</div>`;
                return;
            }

            const item = displayProducts[currentCardIndex];
            const imgUrl = item.image_url || 'https://via.placeholder.com/400';
            const price = item.price ? (item.price.toString().startsWith('$') ? item.price : `$${item.price}`) : '';

            container.innerHTML = `
                <div class="glass-panel p-4 rounded-3xl h-full flex flex-col justify-between relative overflow-hidden border border-white/10">
                    <div class="relative w-full h-64 rounded-2xl overflow-hidden bg-black/40 flex-shrink-0 cursor-zoom-in" onclick="openImageModal('${imgUrl}')">
                        <img src="${imgUrl}" class="w-full h-full object-cover">
                        <span class="absolute top-3 left-3 bg-black/60 backdrop-blur-md border border-white/10 text-white font-mono text-[10px] px-2.5 py-1 rounded-full">#${item.id}</span>
                        <span class="absolute top-3 right-3 bg-red-500/80 backdrop-blur-md text-white font-black text-xs px-2.5 py-1 rounded-full">${price}</span>
                        <div class="absolute bottom-2 right-2 bg-black/60 backdrop-blur-md text-gray-200 text-[10px] font-bold px-2 py-0.5 rounded-full">🔍 Tap to zoom</div>
                    </div>

                    <div class="my-3 flex-1 flex flex-col justify-center">
                        <h2 class="text-base font-bold text-white line-clamp-2">${item.title || 'Clearance Product'}</h2>
                        <p class="text-xs text-gray-400 mt-1 line-clamp-2">${item.description || 'Limited clearance item. First come first served.'}</p>
                    </div>

                    <div class="grid grid-cols-3 gap-2 flex-shrink-0 pt-2 border-t border-white/10">
                        <button onclick="nextCard()" class="py-2.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl text-xs font-bold text-gray-300">
                            👎 Next
                        </button>
                        <button onclick="claimItem(${item.id}, 'SHARE')" class="py-2.5 bg-indigo-500/20 hover:bg-indigo-500/30 border border-indigo-500/30 rounded-xl text-xs font-bold text-indigo-300">
                            🤝 Share
                        </button>
                        <button onclick="claimItem(${item.id}, 'CLAIM_ALL')" class="py-2.5 bg-red-500 hover:bg-red-600 rounded-xl text-xs font-black text-white shadow-lg shadow-red-500/30">
                            👑 Claim
                        </button>
                    </div>
                </div>
            `;
        }

        function nextCard() {
            if (currentCardIndex < displayProducts.length - 1) {
                currentCardIndex++;
                renderCardView();
            } else {
                currentCardIndex = 0;
                renderCardView();
            }
        }

        // 6. 网格视图渲染（绑定图片点击放大 ＋ 穿插抽奖 Banner）
        function renderGridView() {
            const gridView = document.getElementById('grid-view');
            gridView.innerHTML = '';
            
            // 确保无 hidden 类名
            gridView.className = "w-full h-full overflow-y-auto custom-scroll grid grid-cols-2 gap-3 p-3 content-start";

            if (!displayProducts.length) {
                gridView.innerHTML = `<div class="col-span-2 text-center py-20 text-xs text-gray-500">No products available.</div>`;
                return;
            }

            displayProducts.forEach((item, index) => {
                // 每隔 10 个网格商品插入一个抽奖 Banner
                if (index > 0 && index % 10 === 0) {
                    const luckyCard = document.createElement('div');
                    luckyCard.className = "col-span-2 my-1 p-3.5 rounded-2xl bg-gradient-to-r from-purple-900/80 via-pink-900/80 to-red-900/80 border border-pink-500/40 flex items-center justify-between shadow-lg relative overflow-hidden cursor-pointer";
                    luckyCard.onclick = () => openLuckyWheelModal();
                    
                    luckyCard.innerHTML = `
                        <div class="relative z-10">
                            <div class="flex items-center gap-1.5 mb-0.5">
                                <span class="bg-yellow-400 text-black text-[9px] font-black px-1.5 py-0.2 rounded-full uppercase">🎁 DAILY BONUS</span>
                                <span class="text-[10px] text-pink-200 font-bold">Win Labubu / Vouchers!</span>
                            </div>
                            <div class="text-xs font-black text-white">LUCKY DRAW SPINNER</div>
                        </div>
                        <button class="relative z-10 px-3 py-1.5 bg-yellow-400 text-black font-black text-[11px] rounded-xl shadow-md flex-shrink-0">
                            SPIN 🎡
                        </button>
                    `;
                    gridView.appendChild(luckyCard);
                }

                const imgUrl = item.image_url || 'https://via.placeholder.com/200';
                const price = item.price ? (item.price.toString().startsWith('$') ? item.price : `$${item.price}`) : '';

                const card = document.createElement('div');
                card.className = "glass-panel p-2.5 rounded-2xl flex flex-col justify-between border border-white/10 relative overflow-hidden";
                card.innerHTML = `
                    <div class="relative w-full h-36 rounded-xl overflow-hidden bg-black/40 mb-2 cursor-zoom-in" onclick="openImageModal('${imgUrl}')">
                        <img src="${imgUrl}" class="w-full h-full object-cover">
                        <span class="absolute top-1.5 left-1.5 bg-black/60 backdrop-blur-md text-white font-mono text-[9px] px-2 py-0.5 rounded-full">#${item.id}</span>
                    </div>
                    <div class="text-xs font-bold text-white truncate mb-1">${item.title || 'Product'}</div>
                    <div class="text-xs font-black text-amber-400 mb-2">${price}</div>
                    <div class="grid grid-cols-2 gap-1.5">
                        <button onclick="claimItem(${item.id}, 'SHARE')" class="py-1.5 bg-indigo-500/20 text-indigo-300 text-[10px] font-bold rounded-lg border border-indigo-500/30">
                            🤝 Share
                        </button>
                        <button onclick="claimItem(${item.id}, 'CLAIM_ALL')" class="py-1.5 bg-red-500 text-white text-[10px] font-black rounded-lg shadow-md">
                            👑 Claim
                        </button>
                    </div>
                `;
                gridView.appendChild(card);
            });
        }

        // 7. 抽奖 Modal 函数
        function openLuckyWheelModal() {
            document.getElementById('lucky-modal').classList.remove('hidden');
        }
        function closeLuckyWheelModal() {
            document.getElementById('lucky-modal').classList.add('hidden');
        }
        function startSpin() {
            const btn = document.getElementById('btn-spin');
            btn.innerText = "SPINNING...";
            btn.disabled = true;

            setTimeout(() => {
                alert("🎉 Congratulations! You won a $3 Discount Voucher! Contact support on WhatsApp to claim!");
                btn.innerText = "SPIN NOW 🚀";
                btn.disabled = false;
                closeLuckyWheelModal();
            }, 1200);
        }

        // 8. 购物车与 Claim 逻辑
        function openCartModal() {
            renderCartItems();
            document.getElementById('cart-modal').classList.remove('hidden');
        }
        function closeCartModal() {
            document.getElementById('cart-modal').classList.add('hidden');
        }

        async function claimItem(productId, type) {
            alert(`Claim request for #${productId} (${type}) received!`);
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items-list');
            container.innerHTML = `<div class="text-center py-8 text-xs text-gray-500">Your cart is clear.</div>`;
        }

        // 页面首次加载
        fetchProducts();
    </script>
</body>
</html>
