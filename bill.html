<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - All Bills & Claims</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f17;
        }
        .glass-panel {
            background: rgba(18, 24, 38, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-[#0b0f17] min-h-screen flex flex-col items-center justify-start p-4 text-gray-100 select-none">

    <!-- Header -->
    <header class="w-full max-w-md flex justify-between items-center py-3 mb-2 z-10 border-b border-white/10">
        <div class="flex items-center gap-2">
            <a href="index.html" class="glass-panel px-3 py-1.5 rounded-xl text-xs font-bold text-gray-300 hover:text-white transition">
                ← Back
            </a>
            <h1 class="text-base font-black text-white tracking-tight">ADMIN BILLING DASHBOARD</h1>
        </div>
        <div class="text-[10px] font-bold bg-red-500/20 text-red-400 px-2.5 py-1 rounded-full border border-red-500/30">
            👑 ADMIN VIEW
        </div>
    </header>

    <!-- Main List Container -->
    <main class="w-full max-w-md flex-1 overflow-y-auto custom-scroll pr-1">
        <div id="bills-container" class="space-y-4">
            <div class="text-center text-xs text-gray-500 py-10">Loading all customer claims...</div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://vyzxhhetywwljkehelvo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_tIGjO_Xe0Mv-9ormYe3VjQ_WGc1rlpR'; // 👈 替换你的凭证 Key

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 核心渲染逻辑：按天分组，组内优先排列 CLAIM_ALL 与 SHARE_FULL
        function renderBills(bills) {
            const container = document.getElementById('bills-container');
            container.innerHTML = '';

            if (!bills || bills.length === 0) {
                container.innerHTML = `
                    <div class="text-center space-y-3 py-16 glass-panel rounded-3xl border border-white/10">
                        <div class="text-3xl">🧾</div>
                        <div class="text-sm font-bold text-white">No Claims Recorded</div>
                        <div class="text-xs text-gray-400">No customers have claimed products yet.</div>
                    </div>`;
                return;
            }

            // 1. 按日期分组 (例如: "Aug 22, 2026")
            const groupedByDate = {};
            bills.forEach(item => {
                const dateObj = new Date(item.created_at || item.updated_at || Date.now());
                const dateStr = dateObj.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });

                if (!groupedByDate[dateStr]) {
                    groupedByDate[dateStr] = [];
                }
                groupedByDate[dateStr].push(item);
            });

            // 2. 遍历每天记录并在【每天组内】重排优先级
            Object.keys(groupedByDate).forEach(date => {
                const dayBills = groupedByDate[date];

                // 当天组内排序规则：CLAIM_ALL 和 SHARE_FULL / SHARE 置顶
                dayBills.sort((a, b) => {
                    const priorityStatuses = ['claim_all', 'claimed_all', 'share_full', 'sharing'];
                    
                    const statusA = (a.status || '').toLowerCase();
                    const statusB = (b.status || '').toLowerCase();

                    const isPriorityA = priorityStatuses.includes(statusA);
                    const isPriorityB = priorityStatuses.includes(statusB);

                    if (isPriorityA && !isPriorityB) return -1; // A 靠前
                    if (!isPriorityA && isPriorityB) return 1;  // B 靠前
                    return 0; // 维持原有自然排序
                });

                // 3. 渲染天的 DOM 结构
                const dateGroup = document.createElement('div');
                dateGroup.className = "mb-5 space-y-2";

                let groupHtml = `
                    <div class="text-xs font-black text-indigo-400 uppercase tracking-wider px-1 flex items-center justify-between">
                        <span class="flex items-center gap-1.5">📅 ${date}</span>
                        <span class="text-[10px] text-gray-500 font-normal">${dayBills.length} Claims</span>
                    </div>
                `;

                dayBills.forEach(item => {
                    const status = (item.status || '').toUpperCase();
                    const isSpecial = ['CLAIM_ALL', 'CLAIMED_ALL', 'SHARE_FULL'].includes(status);

                    const price = item.price ? (item.price.toString().startsWith('$') ? item.price : `$${item.price}`) : 'N/A';
                    const imgUrl = item.image_url || 'https://via.placeholder.com/80';
                    const timeStr = new Date(item.created_at || item.updated_at || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    
                    // 获取 Claim 用户列表信息
                    const claimers = item.claimed_by || 'Unknown User';

                    let badgeColor = 'bg-gray-500/20 text-gray-300 border-gray-500/30';
                    let badgeText = status;

                    if (status === 'CLAIM_ALL' || status === 'CLAIMED_ALL') {
                        badgeColor = 'bg-red-500/20 text-red-300 border-red-500/40';
                        badgeText = '👑 CLAIM ALL';
                    } else if (status === 'SHARE_FULL') {
                        badgeColor = 'bg-purple-500/20 text-purple-300 border-purple-500/40';
                        badgeText = '🔒 SHARE FULL';
                    } else if (status === 'SHARING') {
                        badgeColor = 'bg-indigo-500/20 text-indigo-300 border-indigo-500/40';
                        badgeText = '🤝 SHARING';
                    }

                    groupHtml += `
                        <div class="p-3.5 rounded-2xl ${isSpecial ? 'bg-gradient-to-r from-red-950/30 to-purple-950/30 border border-red-500/30' : 'glass-panel'} flex items-center justify-between gap-3 shadow-md">
                            <img src="${imgUrl}" class="w-12 h-12 object-cover rounded-xl bg-black/40 flex-shrink-0">
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-1.5">
                                    <span class="text-xs font-black text-white truncate">${item.title || 'Clearance Product'}</span>
                                </div>
                                <div class="text-[10px] text-emerald-400 font-bold mt-0.5 truncate">
                                    👤 ${claimers}
                                </div>
                                <div class="text-[9px] text-gray-400 mt-0.5 flex items-center gap-2">
                                    <span>🕒 ${timeStr}</span>
                                    <span>•</span>
                                    <span>ID: #${item.id}</span>
                                </div>
                            </div>
                            <div class="text-right flex flex-col items-end flex-shrink-0">
                                <span class="text-sm font-black text-amber-400">${price}</span>
                                <span class="text-[9px] font-extrabold px-2 py-0.5 mt-1 rounded-full border ${badgeColor}">
                                    ${badgeText}
                                </span>
                            </div>
                        </div>
                    `;
                });

                dateGroup.innerHTML = groupHtml;
                container.appendChild(dateGroup);
            });
        }

        // 管理员模式：从 Supabase 加载所有被 Claim 过/分享中的商品记录
        async function loadAllAdminBills() {
            try {
                const { data, error } = await supabaseClient
                    .from('products')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) {
                    document.getElementById('bills-container').innerHTML = `
                        <div class="text-center text-xs text-red-400 py-10">Error loading bills: ${error.message}</div>`;
                    return;
                }

                // 过滤出所有有 claimed_by 记录的全部商品（不限用户）
                const allClaimedBills = data.filter(item => item.claimed_by && item.claimed_by.trim() !== '');

                renderBills(allClaimedBills);
            } catch (err) {
                document.getElementById('bills-container').innerHTML = `
                    <div class="text-center text-xs text-red-400 py-10">Exception: ${err.message}</div>`;
            }
        }

        loadAllAdminBills();
    </script>
</body>
</html>
