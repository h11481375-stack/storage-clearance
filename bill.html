<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clearance - Admin Bills & Claims</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f17;
        }
        .glass-panel {
            background: rgba(18, 24, 38, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-[#0b0f17] text-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-white/10 pb-4">
            <div>
                <h1 class="text-2xl font-black bg-gradient-to-r from-red-500 to-orange-500 bg-clip-text text-transparent">
                    CLEARANCE BILLS & CLAIMS
                </h1>
                <p class="text-xs text-gray-400 mt-1">Priority: Full Shares & Newest Claims First</p>
            </div>
            
            <div class="flex items-center gap-3 w-full md:w-auto">
                <!-- 搜索框 -->
                <input type="text" id="search-input" oninput="renderBills()" placeholder="Search user or product ID..." 
                       class="px-4 py-2 bg-gray-900/80 border border-white/10 rounded-xl text-xs text-white focus:outline-none focus:border-red-500 transition w-full md:w-64">
                
                <button onclick="loadBills()" class="px-4 py-2 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl text-xs font-bold transition flex-shrink-0">
                    🔄 Refresh
                </button>
            </div>
        </header>

        <!-- Stats Overview -->
        <div id="stats-summary" class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div class="glass-panel p-4 rounded-2xl border border-white/10">
                <div class="text-[10px] text-gray-400 font-bold uppercase">Total Claims</div>
                <div id="stat-total-claims" class="text-xl font-black text-white mt-1">0</div>
            </div>
            <div class="glass-panel p-4 rounded-2xl border border-red-500/20 bg-red-500/5">
                <div class="text-[10px] text-red-400 font-bold uppercase">👑 Claimed All</div>
                <div id="stat-claimed-all" class="text-xl font-black text-red-400 mt-1">0</div>
            </div>
            <div class="glass-panel p-4 rounded-2xl border border-purple-500/20 bg-purple-500/5">
                <div class="text-[10px] text-purple-400 font-bold uppercase">🔒 Share Full (3/3)</div>
                <div id="stat-share-full" class="text-xl font-black text-purple-400 mt-1">0</div>
            </div>
            <div class="glass-panel p-4 rounded-2xl border border-indigo-500/20 bg-indigo-500/5">
                <div class="text-[10px] text-indigo-400 font-bold uppercase">🤝 Active Sharing</div>
                <div id="stat-sharing" class="text-xl font-black text-indigo-400 mt-1">0</div>
            </div>
        </div>

        <!-- Bill List -->
        <div id="bill-container" class="space-y-3">
            <div class="text-center py-12 text-xs text-gray-500">Loading claims...</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vyzxhhetywwljkehelvo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_tIGjO_Xe0Mv-9ormYe3VjQ_WGc1rlpR'; // 👈 记得替换 Key

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let productsData = [];

        async function loadBills() {
            try {
                let allProducts = [];
                let page = 0;
                const pageSize = 1000;
                let hasMore = true;

                while (hasMore) {
                    const { data, error } = await supabaseClient
                        .from('products')
                        .select('*')
                        .not('claimed_by', 'is', null) // 只调取已被 Claim 的品
                        .order('id', { ascending: false })
                        .range(page * pageSize, (page + 1) * pageSize - 1);

                    if (error) { alert('Error: ' + error.message); return; }

                    if (data && data.length > 0) {
                        // 排除 claimed_by 为空的字符串
                        const filtered = data.filter(p => p.claimed_by && p.claimed_by.trim() !== '');
                        allProducts = allProducts.concat(filtered);
                        if (data.length < pageSize) hasMore = false;
                        else page++;
                    } else { hasMore = false; }
                }

                productsData = allProducts;
                renderBills();
            } catch (err) {
                alert('Network exception: ' + err.message);
            }
        }

        function renderBills() {
            const container = document.getElementById('bill-container');
            const searchKeyword = document.getElementById('search-input').value.trim().toLowerCase();

            // 1. 关键词过滤
            let filtered = productsData.filter(p => {
                const titleMatch = (p.title || '').toLowerCase().includes(searchKeyword);
                const idMatch = (p.id || '').toString().includes(searchKeyword);
                const userMatch = (p.claimed_by || '').toLowerCase().includes(searchKeyword);
                return titleMatch || idMatch || userMatch;
            });

            // 2. 核心排序逻辑：优先将 SHARE_FULL 与 CLAIMED_ALL 提到最上方，其次按 ID (最新) 倒序
            filtered.sort((a, b) => {
                const getPriority = (item) => {
                    const status = item.status || '';
                    if (status === 'SHARE_FULL') return 1;    // 🔒 最优先：已拼满的品（必须发货/出账）
                    if (status === 'CLAIMED_ALL' || status === 'CLAIM_ALL') return 2; // 👑 次优先：独占的品
                    if (status === 'SHARING') return 3;       // 🤝 拼单中
                    return 4;
                };

                const pA = getPriority(a);
                const pB = getPriority(b);

                if (pA !== pB) return pA - pB;
                return b.id - a.id; // 相同优先级下，ID 越大（最新）越靠前
            });

            // 3. 统计计数
            let totalClaims = filtered.length;
            let countClaimedAll = 0;
            let countShareFull = 0;
            let countSharing = 0;

            filtered.forEach(p => {
                if (p.status === 'CLAIMED_ALL' || p.status === 'CLAIM_ALL') countClaimedAll++;
                else if (p.status === 'SHARE_FULL') countShareFull++;
                else if (p.status === 'SHARING') countSharing++;
            });

            document.getElementById('stat-total-claims').innerText = totalClaims;
            document.getElementById('stat-claimed-all').innerText = countClaimedAll;
            document.getElementById('stat-share-full').innerText = countShareFull;
            document.getElementById('stat-sharing').innerText = countSharing;

            container.innerHTML = '';

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-xs text-gray-500">No claim records found.</div>`;
                return;
            }

            // 4. 渲染打平后的列表
            filtered.forEach(item => {
                const imgUrl = item.image_url || 'https://via.placeholder.com/100';
                const price = item.price ? (item.price.toString().startsWith('$') ? item.price : `$${item.price}`) : 'Deal';
                
                // 解析参与的所有用户
                const users = (item.claimed_by || '').split(',').map(s => s.trim()).filter(Boolean);

                // 状态标签定义
                let statusBadge = '';
                if (item.status === 'SHARE_FULL') {
                    statusBadge = `<span class="bg-purple-500/20 text-purple-300 border border-purple-500/30 text-[10px] font-black px-2.5 py-1 rounded-full">🔒 SHARE FULL (3/3)</span>`;
                } else if (item.status === 'CLAIMED_ALL' || item.status === 'CLAIM_ALL') {
                    statusBadge = `<span class="bg-red-500/20 text-red-400 border border-red-500/30 text-[10px] font-black px-2.5 py-1 rounded-full">👑 CLAIMED ALL</span>`;
                } else if (item.status === 'SHARING') {
                    statusBadge = `<span class="bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 text-[10px] font-black px-2.5 py-1 rounded-full">🤝 SHARING (${users.length}/3)</span>`;
                } else {
                    statusBadge = `<span class="bg-gray-500/20 text-gray-300 border border-gray-500/30 text-[10px] font-black px-2.5 py-1 rounded-full">${item.status}</span>`;
                }

                // 用户 Chip 标签
                const userChipsHtml = users.map(u => 
                    `<span class="bg-white/10 text-white border border-white/10 text-[11px] font-bold px-2 py-0.5 rounded-lg">👤 ${u}</span>`
                ).join(' ');

                const card = document.createElement('div');
                card.className = "glass-panel p-4 rounded-2xl flex flex-col md:flex-row items-start md:items-center justify-between gap-4 relative overflow-hidden hover:border-white/20 transition";

                card.innerHTML = `
                    <div class="flex items-center gap-4 min-w-0 flex-1">
                        <img src="${imgUrl}" class="w-16 h-16 object-cover rounded-xl bg-black/40 flex-shrink-0 border border-white/10">
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-2 mb-1 flex-wrap">
                                ${statusBadge}
                                <span class="text-xs font-mono text-gray-400">ID: #${item.id}</span>
                            </div>
                            <h3 class="text-sm font-bold text-white truncate">${item.title || 'Product'}</h3>
                            <div class="flex items-center gap-2 mt-2 flex-wrap">
                                <span class="text-xs font-semibold text-gray-400">Claimed By:</span>
                                ${userChipsHtml}
                            </div>
                        </div>
                    </div>

                    <div class="flex md:flex-col items-end justify-between w-full md:w-auto border-t md:border-t-0 border-white/5 pt-2 md:pt-0 gap-1 flex-shrink-0">
                        <div class="text-base font-black text-amber-400">${price}</div>
                        <div class="text-[10px] text-gray-400 font-medium">Stock Left: ${item.stock || 0}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 初始化加载
        loadBills();
    </script>
</body>
</html>
